<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pair Trading — Cointegration Pipeline</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:       #06080f;
  --bg2:      #0c1018;
  --bg3:      #111722;
  --bg4:      #161e2d;
  --border:   #1e2d42;
  --border2:  #253448;
  --text:     #dde4f0;
  --muted:    #4e6380;
  --dim:      #2a3d57;
  --accent:   #00d4ff;
  --accent2:  #7c3aed;
  --green:    #00e5a0;
  --red:      #ff4d6d;
  --yellow:   #ffd166;
  --orange:   #ff9f43;
  --mono:     'JetBrains Mono', monospace;
  --head:     'Syne', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:13px;min-height:100vh;overflow-x:hidden;}

/* HEADER */
.header{
  background:linear-gradient(135deg,var(--bg2) 0%,#0a1020 100%);
  border-bottom:1px solid var(--border);
  padding:18px 32px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:200;
}
.logo-block{display:flex;flex-direction:column;gap:2px;}
.logo{font-family:var(--head);font-size:20px;font-weight:800;letter-spacing:-0.02em;color:var(--accent);}
.logo span{color:var(--muted);}
.subtitle{font-size:10px;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;}
.run-btn{
  background:linear-gradient(135deg,var(--accent) 0%,#0099cc 100%);
  color:#000;border:none;padding:10px 26px;border-radius:6px;
  font-family:var(--head);font-size:13px;font-weight:700;cursor:pointer;
  letter-spacing:0.05em;transition:all 0.2s;
  box-shadow:0 0 20px rgba(0,212,255,0.3);
}
.run-btn:hover{box-shadow:0 0 32px rgba(0,212,255,0.6);transform:translateY(-1px);}
.run-btn.running{background:linear-gradient(135deg,var(--yellow),#f59e0b);animation:pulse 0.8s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.7}}
